<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>お店メモ</title>
  <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

  <!-- 共有時のプレビュー（OGP / Twitter Card）-->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="お店メモ" />
  <meta property="og:title" content="お店メモ — 自分だけのお店の再訪メモ" />
  <meta property="og:description" content="飲食店ごとに自分専用のメモ。外食の「前どうだっけ？」を解決。インストール不要・無料。" />
  <meta property="og:url" content="https://nibosea.github.io/oshise-memo/" />
  <meta property="og:image" content="https://nibosea.github.io/oshise-memo/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="お店メモ — 自分だけのお店の再訪メモ" />
  <meta name="twitter:description" content="飲食店ごとに自分専用のメモ。外食の「前どうだっけ？」を解決。インストール不要・無料。" />
  <meta name="twitter:image" content="https://nibosea.github.io/oshise-memo/og-image.png" />

  <!-- PWA / iOSホーム画面対応 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="お店メモ" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"><!-- 画面はJSで描画 --></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Service Worker 登録（オフライン＆インストール用）。file:// では無効なので握りつぶす。
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

  <!-- アクセス解析（GoatCounter・Cookie不使用）。訪問イベントのみ送信。メモの中身は一切送らない -->
  <script data-goatcounter="https://nibosea.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
